[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "CyLinter"
version = "0.0.57"
description = "CyLinter: An Interactive Image Segmentation Filter for Multiplex Microscopy"
readme = "README.md"
license = "MIT"
keywords = ["CyLinter", "multiplex microscopy", "quality control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Framework :: napari",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization"
]
authors = ["Gregory J. Baker <gregory_baker2@hms.harvard.edu>"]
homepage = "https://github.com/labsyspharm/cylinter"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
cellcutter = "*"
hdbscan = "*"
joblib = "*"
magicgui = "*"
matplotlib = "*"
napari = ">=0.9.0"  # newer napari versions handle scalebar metadata differently
numpy = "*"
natsort = "*"
numba = "*"
pandas = "*"
pyarrow = "*"
pyqt6 = "*"
pyyaml = "*"
qtpy = "*"
scikit-image = "*"
scikit-learn = "*"
seaborn = "*"
umap-learn = "*"
zarr = "*"
tifffile = "*"
svglib = "*"
pypdf2 = "*"
imagecodecs = "*"  # MIBI data fails to be read without this
opencv-python = "*"

[tool.poetry.scripts]
cylinter = "cylinter.cylinter:main"