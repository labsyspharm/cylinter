{% set name = "cylinter" %}
{% set version = "0.0.57" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  git_url: https://github.com/labsyspharm/cylinter.git
  git_tag: v0.0.57

build:
  number: 0
  noarch: python
  script:
    - "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv"
  entry_points:
    - cylinter=cylinter.cylinter:main

requirements:
  host:
    - pip
    - python >=3.11,<3.14 
    - poetry-core >=1.0.0

  run:
    - python >=3.11,<3.14
    - cellcutter >=0.2.13  # this version is compatible with Zarr3 
    - hdbscan
    - joblib
    - magicgui
    - matplotlib
    - napari >=0.9.0  # cylinter code compatible with newer napari versions that handle scalebar metadata differently
    - numpy
    - natsort
    - numba
    - pandas
    - pyarrow
    - pyqt6
    - qt6-main  # 6.8.4 leads to frozen widget window sliders, but conda solve fails with 6.8.2
    - ffmpeg
    - pyyaml
    - qtpy
    - scikit-image
    - scikit-learn
    - seaborn
    - umap-learn
    - zarr >=3
    - tifffile
    - svglib
    - pypdf2
    - imagecodecs  # MIBI data fails to be read without this
    - opencv

test:
  imports:
    - cylinter

about:
  home: https://labsyspharm.github.io/cylinter/
  license: MIT
  summary: Quality Control Software for Multiplex Microscopy